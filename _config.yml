title: Kuat Telegenov
url: "https://kuatt.com"
baseurl: ""

# Exclude everything except the main page
exclude:
  - _posts
  - _pages
  - _data
  - _includes
  - _layouts
  - assets
  - favicon
  - Gemfile
  - Gemfile.lock
  - README.md
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

# SEO Tag settings
webmaster_verifications:
  google: "bO4xJWsF6dDW575FttkC9nvcoH_u_6rTfXYU-GUaWAI"

# Feed settings
atom_feed:
  path: # blank (default) uses feed.xml
  hide: false

# HTML Compression for better performance
compress_html:
  clippings: all
  ignore:
    envs: development

# Reading time and meta
show_date: true
read_time: true
words_per_minute: 200

# Enable copy code button
enable_copy_code_button: true

author:
  name   : "Kuat Telegenov"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Systems Development Engineer at Amazon"
  location: "Boston, MA"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:ktelegenov@gmail.com"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ktelegenov"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google"
      url: "https://scholar.google.com/citations?user=fRByoW0AAAAJ"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/ktelegenov"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ktelegenov"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/kuat.telegenov"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/ktelegenov"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://x.com/ktelegenov"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ktelegenov"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/kuat.telegenov"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
